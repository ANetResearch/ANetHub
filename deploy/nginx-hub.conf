# hub.agentnetwork.org.cn — production (TLS terminates here, anet-hub on 127.0.0.1:8088).
# Install: /etc/nginx/sites-available/hub.agentnetwork.org.cn
#
# Logs (A2A-DESIGN X1, §21 item 1) [redteam:F3]. The request lines this vhost serves name agents
# (/agents/<aid>/..., /a2a/v1/agents/<aid>/card, /fed/v2/keys/<aid>, /x402/resource/<aid>/...), and
# each comes from the client's address. Kept on disk, they rebuild who talked to whom, when and how
# much (a sender's lookups and sends, a recipient's polls and their response sizes) long after
# /relay/ack deleted the envelope: the hub does not store the social graph, and an access log would.
# So both server blocks below:
#   - keep no access log (access_log off; it also replaces the http-level access_log of nginx.conf);
#   - keep an error log at crit only. An [error] line (the hub down or restarting, a body over
#     client_max_body_size, a timeout) carries "client: <address>" and "request: <request line>";
#     a [crit] line is written before a request is read (TLS, sockets, workers) and carries at most
#     an address.
# Retention: /var/log/nginx/hub.error.log is rotated by the host's logrotate rule for
# /var/log/nginx/*.log (Debian/Ubuntu stock /etc/logrotate.d/nginx: daily, rotate 14, compress), so
# nothing in it is older than 14 days. To debug, lower the level for that session and delete the file
# afterwards; do not add an access_log or a log_format with $remote_addr or $request/$request_uri here.
# internal/aghub/proxylog_test.go checks this file and nginx-hub.conf.example.

server {
    listen 80;
    listen [::]:80;
    server_name hub.agentnetwork.org.cn;
    # A plain-http request line names agents as well (see the top of this file).
    access_log off;
    error_log  /var/log/nginx/hub.error.log crit;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.agentnetwork.org.cn;

    ssl_certificate     /etc/letsencrypt/live/hub.agentnetwork.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.agentnetwork.org.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # No access log, error log at crit only: see the top of this file.
    access_log off;
    error_log  /var/log/nginx/hub.error.log crit;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- self-hosted anet downloads (installer + prebuilt binaries) ---
    # A mirror of the signed release, served from a static dir so
    # `curl --proto '=https' -fsSL https://hub.agentnetwork.org.cn/install.sh | sh` works without the
    # apex site. Populated from ANet's dist/ (ANet/deploy/release/build-release.sh): install.sh and
    # install.sh.sig here, release.json, release.json.sig and the .gz assets under /dl/. Nothing
    # served here is trusted by the installer or `anet update` beyond what the release key signed.
    location = /install.sh {
        root /data/projs/anet-hub/public;
        default_type text/x-shellscript;
        add_header Cache-Control "no-cache" always;
    }
    location = /install.sh.sig {
        root /data/projs/anet-hub/public;
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
    }
    location ^~ /dl/ {
        alias /data/projs/anet-hub/public/dl/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        # The largest body the hub accepts is a /relay/send carrying the largest sealed envelope:
        # Limits.sendBodyLimit() in internal/aghub/limits.go = base64 of -relay-max-envelope
        # (DefaultLimits().MaxEnvelope, 96 MiB) + 64 KiB of JSON = 134,283,264 bytes ≈ 128.06 MiB.
        # /fed/v1/forward from a peer hub has the same bound (federation.forwardBodyLimit).
        # 129m is the next whole MiB. Below it nginx answers large envelopes with its own HTML 413
        # and the daemon never sees the hub's JSON error. Raise it with -relay-max-envelope (4/3 of it);
        # internal/aghub/deploylimits_test.go checks the two stay in step.
        client_max_body_size 129m;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml;
}
