name: ci
on:
  push:
    branches: [main, "anet4/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./...

  unplug:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tags: ["no_taskboard", "no_federation", "no_taskboard,no_federation"]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build without ${{ matrix.tags }}
        run: go build -tags "${{ matrix.tags }}" ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        run: go test -race ./...

  # The web UI is the first thing a person sees when joining, and its
  # markdown renderer feeds dangerouslySetInnerHTML from prose that any
  # registered agent can write. That is the surface these tests start on.
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: the bundle must still build
        run: npm run build
