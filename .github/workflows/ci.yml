# ANetCore 打 tag 后改回 go.mod 版本: until then the Go jobs build through a
# go.work over an ANetCore checkout (.github/actions/anetcore), because
# go.mod's ANetCore v0.14.0 has no seal/a2acard.
name: ci
on:
  push:
    branches: [main, "anet4/**", a2a-redesign-wip]
  pull_request:
  # By hand on a branch the push filter does not cover (a2a-redesign-wip
  # is one), as ANet's CI allows.
  workflow_dispatch:

# Every Go job starts with ./.github/actions/anetcore: while ANetCore
# v0.15.0 is untagged, go.mod cannot build this tree and the action puts a
# pinned ANetCore checkout in a workspace. It does nothing once go.mod can
# (A2A-DESIGN §18). ANet's CI does the same.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/anetcore
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      # The deploy scripts (hub-db-roll.sh, cleanup-content-v0.2.sh) need
      # the sqlite3 CLI; deploy/scripts_test.go skips without it, and
      # ANET_HUB_SCRIPT_TESTS=require turns that skip into a failure here.
      - name: sqlite3 for the deploy script tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
      - name: tests
        env:
          ANET_HUB_SCRIPT_TESTS: require
        run: go test ./...

  # Subtractive tags: the module is in the default build and `-tags no_<name>`
  # removes it. "Removable" is proved by symbol count in both directions (the
  # full build contains the module, the lean build contains none of it), and
  # the tests run in the lean build too. Building alone proved only that the
  # lean variant compiles; it did not show the module was gone, and the
  # symbol check is what found the kernel still linking two federation error
  # values in a no_federation build (see internal/seamerr).
  unplug:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: "no_federation"
            pattern: "internal/federation"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/anetcore
      - name: build, vet and test without ${{ matrix.tags }}
        run: |
          go build -tags "${{ matrix.tags }}" ./...
          go vet -tags "${{ matrix.tags }}" ./...
          go test -tags "${{ matrix.tags }}" ./...
      - name: the module is in the full build and absent from the lean one
        run: |
          go build -o /tmp/hub-full ./cmd/anet-hub
          go build -tags "${{ matrix.tags }}" -o /tmp/hub-lean ./cmd/anet-hub
          pat="${{ matrix.pattern }}"
          full=$(go tool nm /tmp/hub-full | grep -cE "$pat" || true)
          lean=$(go tool nm /tmp/hub-lean | grep -cE "$pat" || true)
          echo "$pat symbols: full=$full lean=$lean"
          test "$full" -gt 0 || (echo "the full build should contain $pat" && exit 1)
          test "$lean" -eq 0 || (echo "$pat is still linked into the ${{ matrix.tags }} build" && exit 1)
          /tmp/hub-lean -version >/dev/null

  # Additive tags: the module is NOT in the default build and `-tags <name>`
  # adds it. taskboard is additive because a board stores caller-supplied
  # titles and notes and serves them to anyone (A2A-DESIGN §2, §16), and a
  # hub must not hold task content by default. The direction of the symbol
  # check is reversed: the default build must contain none of it, the opt-in
  # build must contain it. The default `go test ./...` cannot see tagged
  # code at all, so the module's own tests run only here.
  optin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "taskboard"
            pattern: "internal/taskboard"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/anetcore
      - name: vet and test with the module in
        run: |
          go vet -tags "${{ matrix.tag }}" ./...
          go test -tags "${{ matrix.tag }}" ./...
      - name: the module is absent by default and present when asked
        run: |
          go build -o /tmp/hub-default ./cmd/anet-hub
          go build -tags "${{ matrix.tag }}" -o /tmp/hub-optin ./cmd/anet-hub
          pat="${{ matrix.pattern }}"
          def=$(go tool nm /tmp/hub-default | grep -cE "$pat" || true)
          opt=$(go tool nm /tmp/hub-optin | grep -cE "$pat" || true)
          echo "$pat symbols: default=$def opt-in=$opt"
          test "$def" -eq 0 || (echo "$pat is linked into the DEFAULT build" && exit 1)
          test "$opt" -gt 0 || (echo "-tags ${{ matrix.tag }} did not link $pat in" && exit 1)
          /tmp/hub-default -version >/dev/null
          /tmp/hub-optin -version >/dev/null
      # internal/aghub/importguard_test.go runs `go list -deps` without
      # tags, so under `go test -tags ${{ matrix.tag }}` it still checks the
      # default build. The opt-in binary must not pull the content codecs
      # (or a subpackage of one, as the test counts them) into the hub
      # either (A2A-DESIGN §9 静态护栏).
      - name: the opt-in build links no content codec
        run: |
          deps=$(go list -tags "${{ matrix.tag }}" -deps ./cmd/anet-hub ./cmd/anet-hub-admin | grep -E 'ANetCore/(delegation|tsir)(/|$)' || true)
          test -z "$deps" || (echo "-tags ${{ matrix.tag }} links: $deps" && exit 1)

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/anetcore
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        run: |
          go test -race ./...
          go test -race -tags taskboard ./internal/taskboard/... ./cmd/anet-hub/...

  # The web UI is the first thing a person sees when joining, and its
  # markdown renderer feeds dangerouslySetInnerHTML from prose that any
  # registered agent can write. That is the surface these tests start on.
  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: the sources type-check
        run: npx tsc --noEmit -p .
      - name: the bundle must still build
        run: npm run build
      # The hub serves internal/aghub/web/index.html, a committed copy of
      # this build (scripts/build.sh copies it and compares). A source
      # change without a rebuilt copy ships the old page.
      - name: the embedded page is this build
        run: cmp dist/index.html ../internal/aghub/web/index.html
