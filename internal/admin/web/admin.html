<style>
/* Design tokens: grey, black and white; red #E93024 is reserved for emphasis. Light and dark follow the
   system and can be switched with the theme control (data-theme on <html>). */
:root{
  --bg:#f4f4f5; --surface:#ffffff; --surface-2:#f4f4f5; --fg:#0b0b0c; --muted:#55575d; --line:#d6d7db;
  --accent:#e93024; --accent-text:#c4231a; --accent-fg:#ffffff; --focus:#e93024;
  --ok:#1f7a3d; --warn:#8a5a00; --err:#c4231a; --overlay:rgba(10,10,12,.55);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,-apple-system,"PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --surface:#131316; --surface-2:#1b1b1f; --fg:#ececee; --muted:#a3a5ab; --line:#2d2e33;
    --accent-text:#ff6b60; --ok:#52c27a; --warn:#e3a33b; --err:#ff6b60; --overlay:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#131316; --surface-2:#1b1b1f; --fg:#ececee; --muted:#a3a5ab; --line:#2d2e33;
  --accent-text:#ff6b60; --ok:#52c27a; --warn:#e3a33b; --err:#ff6b60; --overlay:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.6 var(--sans);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-48px;z-index:100;background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:6px}
.skip:focus{top:8px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.sp{flex:1}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}

/* ---- shell: left navigation and content area ---- */
#app{display:none;min-height:100%}
#side{position:fixed;top:0;left:0;bottom:0;width:232px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
#side .brand{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
#side .brand svg.logo{display:block;width:100%;height:auto;max-width:176px}
#side .brand small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
#side nav{padding:8px;overflow:auto;flex:1}
.nav{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 12px;border-radius:6px;color:var(--muted);text-align:left;text-decoration:none;border-left:2px solid transparent}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--surface-2);color:var(--fg);font-weight:600;border-left-color:var(--accent)}
#side .foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#content{margin-left:232px;min-height:100vh;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 24px;min-height:56px}
#top h1{font-size:16px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menuBtn{display:none}
main{padding:24px;max-width:1280px;width:100%}
#scrim{display:none;position:fixed;inset:0;background:var(--overlay);z-index:25}
@media (max-width:900px){
  #side{transform:translateX(-100%);transition:transform .18s ease-out;width:260px}
  body.navopen #side{transform:none}
  body.navopen #scrim{display:block}
  #content{margin-left:0}
  #menuBtn{display:inline-flex}
  #top{padding:8px 12px}
  main{padding:16px}
}

/* ---- primitives ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;font-weight:500;white-space:nowrap;transition:border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{background:#c9281d;border-color:#c9281d}
.btn.danger{color:var(--err)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px}
.btn.ic{width:36px;padding:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
textarea.inp{padding:8px 10px;width:100%;font-family:var(--mono);font-size:12px;resize:vertical}
.inp::placeholder{color:var(--muted);opacity:.8}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card>.hd h2{font-size:14px;font-weight:650;flex:1}
.card>.bd{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
@media (max-width:900px){.g2{grid-template-columns:1fr}}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:650;margin-top:4px;line-height:1.2}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.tag.red{border-color:var(--accent);color:var(--accent-text)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.pghd{margin-bottom:16px}
.pghd p{color:var(--muted);max-width:760px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:12px}
.sect{font-size:13px;font-weight:650;margin:24px 0 8px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{overflow-wrap:anywhere}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.banner{display:flex;gap:8px;align-items:flex-start;padding:12px 16px;border:1px solid var(--accent);border-radius:8px;margin-bottom:16px}

/* ---- data table: sortable headers, tabular figures ---- */
.tbw{overflow-x:auto}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tb th{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;background:var(--surface)}
.tb th button{display:inline-flex;align-items:center;gap:4px;min-height:24px;color:inherit;font-weight:inherit}
.tb th button:hover{color:var(--fg)}
.tb th[aria-sort="ascending"] button,.tb th[aria-sort="descending"] button{color:var(--fg);font-weight:600}
.tb td.r,.tb th.r{text-align:right}
.tb tbody tr:hover td{background:var(--surface-2)}
.tb tbody tr:last-child td{border-bottom:0}
.tb a.rowlink{text-decoration:none;font-weight:600}
.tb a.rowlink:hover{text-decoration:underline}
.tbfoot{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* ---- drawer ---- */
#ovl{display:none;position:fixed;inset:0;background:var(--overlay);z-index:50}
#drawer{display:none;position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:51;flex-direction:column}
#drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
#drawer .dh h2{flex:1;font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .db{flex:1;overflow:auto;padding:16px}

/* ---- login ---- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#login .panel{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
#login svg.logo{display:block;width:100%;max-width:220px;height:auto;margin-bottom:20px}
#login h1{font-size:16px;font-weight:650;margin-bottom:4px}
#login p{color:var(--muted);font-size:13px;margin-bottom:16px}
#loginErr{color:var(--err);font-size:13px;margin-top:8px;min-height:20px}

/* ---- toast, spinner, bars ---- */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;background:var(--surface);color:var(--fg);border:1px solid var(--line);padding:10px 16px;border-radius:6px;font-size:13px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{border-color:var(--accent)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--muted)}
.bar.red>i{background:var(--accent)}
pre.out{background:#0a0a0b;color:#e6e7ea;border-radius:6px;padding:12px;font:12px/1.5 var(--mono);overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>

function fmtDay(s){ if (!s) return '–'; const d = new Date(s); return isNaN(d) ? esc(s) : d.toISOString().slice(0, 10); }
function fmtDayNo(n){ return n ? new Date(n * 86400000).toISOString().slice(0, 10) : '–'; }
function shortAid(a){ return a ? (a.length > 20 ? a.slice(0, 10) + '…' + a.slice(-6) : a) : '–'; }
const nf = n => (n ?? 0).toLocaleString('en-US');
const pct = x => x == null ? '–' : (x * 100).toFixed(1) + '%';
const dash = v => (v === '' || v == null) ? '–' : v;
async function api(path, opts = {}){
  const r = await fetch(BASE + '/api' + path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN, ...(opts.headers || {}) } });
  if (r.status === 401 && path !== '/login') { logout(); throw new Error(t('登录已失效，请重新登录。', 'The session has expired. Sign in again.')); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
const loadingHTML = () => `<div class="loading" role="status">${esc(t('正在加载。', 'Loading.'))}</div>`;
const errHTML = m => `<div class="banner" role="alert">${ic('alert')}<div><b>${esc(t('加载失败', 'Loading failed'))}</b><div class="muted">${esc(m)}</div></div></div>`;
const emptyHTML = (title, note) => `<div class="empty"><b>${esc(title)}</b>${note ? esc(note) : ''}</div>`;
function kpi(label, value, sub){ return `<div class="card kpi"><div class="l">${esc(label)}</div><div class="v num">${value}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`; }
function spark(vals, w = 220, h = 44){
  if (!vals || vals.length < 2) return `<span class="muted">${esc(t('数据不足', 'Insufficient data'))}</span>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1) * (w - 6) + 3), (h - 4 - (v - mn) / rg * (h - 8))]);
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('最近值', 'Latest value'))} ${vals[vals.length - 1]}, ${esc(t('最小', 'min'))} ${mn}, ${esc(t('最大', 'max'))} ${mx}"><polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" style="color:var(--muted)"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}

/* ---------------- sortable, filterable table ---------------- */
// cols: [{k, label, num, get(row) -> sort value, html(row) -> cell html}]
const TBL = {};
function tableHTML(id, cols, rows, o = {}){
  const st = TBL[id] || (TBL[id] = { key: o.sort, dir: o.dir || 'desc', limit: 100 });
  let data = rows.slice();
  const col = cols.find(c => c.k === st.key);
  if (col) {
    const g = col.get || (r => r[col.k]);
    data.sort((a, b) => {
      let x = g(a), y = g(b);
      if (col.num) { x = +x || 0; y = +y || 0; return st.dir === 'asc' ? x - y : y - x; }
      x = String(x ?? '').toLowerCase(); y = String(y ?? '').toLowerCase();
      return st.dir === 'asc' ? x.localeCompare(y) : y.localeCompare(x);
    });
  }
  const shown = data.slice(0, st.limit);
  const head = cols.map(c => {
    const on = c.k === st.key;
    return `<th scope="col" class="${c.num ? 'r' : ''}" aria-sort="${on ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-sort="${esc(id)}:${esc(c.k)}">${esc(c.label)}${on ? ic(st.dir === 'asc' ? 'up' : 'down') : ic('sort')}</button></th>`;
  }).join('');
  const body = shown.map(r => `<tr>${cols.map(c => `<td class="${c.num ? 'r num' : ''}">${c.html ? c.html(r) : esc(dash(r[c.k]))}</td>`).join('')}</tr>`).join('');
  const more = data.length > shown.length ? `<button class="btn sm" data-more="${esc(id)}">${esc(t('显示更多', 'Show more'))}</button>` : '';
  return `<div class="tbw"><table class="tb"><caption class="sr">${esc(o.caption || '')}</caption><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}">${emptyHTML(o.emptyTitle || t('无记录', 'No records'), o.emptyNote || '')}</td></tr>`}</tbody></table></div>
  <div class="tbfoot"><span>${esc(t(`共 ${nf(data.length)} 条，显示 ${nf(shown.length)} 条`, `${nf(data.length)} records, ${nf(shown.length)} shown`))}</span>${more}</div>`;
}
// A mounted table re-renders itself on sort, filter or "show more".
const MOUNT = {};
function mountTable(host, id, cols, getRows, o){
  const draw = () => { host.innerHTML = tableHTML(id, cols, getRows(), o); };
  MOUNT[id] = draw; draw(); return draw;
}
document.addEventListener('click', e => {
  const s = e.target.closest('[data-sort]');
  if (s) { const [id, k] = s.dataset.sort.split(':'); const st = TBL[id]; const c = k; st.dir = (st.key === c && st.dir === 'desc') ? 'asc' : 'desc'; st.key = c; MOUNT[id] && MOUNT[id](); const again = document.querySelector(`[data-sort="${id}:${c}"]`); again && again.focus(); return; }
  const m = e.target.closest('[data-more]');
  if (m) { const id = m.dataset.more; TBL[id].limit += 200; MOUNT[id] && MOUNT[id](); }
});

async function doLogin(ev){
  ev.preventDefault();
  const tok = $('#tokIn').value.trim(); if (!tok) return;
  $('#loginBtn').disabled = true; $('#loginErr').textContent = '';
  try {
    const r = await fetch(BASE + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: tok }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || t('令牌校验未通过。', 'The token was not accepted.'));
    TOKEN = tok; try { localStorage.setItem('anethub_admin_token', tok); } catch (e) {}
    $('#tokIn').value = ''; boot();
  } catch (e) { $('#loginErr').textContent = e.message; }
  $('#loginBtn').disabled = false;
}

let CACHE = {};

let SEQ = 0;
async function render(force){
  if (!TOKEN) return;
  if (force) CACHE = {};
  chrome();
  const seq = ++SEQ;
  const parts = parseHash(); const cur = curPage();
  const main = $('#main');
  main.innerHTML = loadingHTML();
  try {
    const html = await VIEWS[cur.id](parts);
    if (seq !== SEQ) return;

let OPENER = null;
function closeDrawer(silent){
  if ($('#drawer').style.display !== 'flex') return;
  $('#drawer').style.display = 'none'; $('#ovl').style.display = 'none';
  if (!silent && /^#\/nodes\/./.test(location.hash)) { history.replaceState(null, '', '#/nodes'); }
  if (OPENER && OPENER.focus && document.contains(OPENER)) OPENER.focus();
  OPENER = null;
}
document.addEventListener('keydown', e => {
  if ($('#drawer').style.display === 'flex') {
    if (e.key === 'Escape') { closeDrawer(); return; }
    if (e.key === 'Tab') {
      const items = Array.from($('#drawer').querySelectorAll('a[href],button:not([disabled]),input,select,textarea')).filter(x => x.offsetParent !== null);
      if (!items.length) return;
      const f = items[0], l = items[items.length - 1];
      if (e.shiftKey && document.activeElement === f) { e.preventDefault(); l.focus(); }
      else if (!e.shiftKey && document.activeElement === l) { e.preventDefault(); f.focus(); }
    }
  } else if (e.key === 'Escape' && document.body.classList.contains('navopen')) setNav(false);
});

  <div class="tools"><label class="f" style="flex:1;min-width:220px">${esc(t('筛选', 'Filter'))}<input id="lq" class="inp" type="search" value="${esc(LF.q)}" placeholder="${esc(t('操作人、操作、对象或说明', 'Actor, action, target or detail'))}"/></label></div>
  <section class="card" id="logCard"></section>`,
    after: () => { const redraw = mountTable($('#logCard'), 'logs', cols, filtered, { sort: 'ts', dir: 'desc', caption: t('审计日志', 'Audit log'), emptyTitle: t('暂无日志', 'No log entries') }); $('#lq').addEventListener('input', e => { LF.q = e.target.value; TBL.logs.limit = 100; redraw(); }); } };
};

/* ---------------- actions, boot ---------------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-delofficial]'); if (!b) return;
  const id = b.dataset.delofficial;
  if (!confirm(t(`删除官方登记 ${id}。该操作不影响节点本身的注册。是否继续？`, `Remove the official registration ${id}. The node's own registration is not affected. Continue?`))) return;
  try { await api('/official/' + encodeURIComponent(id), { method: 'DELETE' }); toast(t('登记已删除。', 'Registration removed.')); render(true); } catch (err) { toast(err.message, true); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'refresh') { render(true); }
  else if (a === 'lang') setLang(L === 'zh' ? 'en' : 'zh');
  else if (a === 'theme') toggleTheme();
  else if (a === 'logout') logout();
  else if (a === 'toggleNav') setNav(!document.body.classList.contains('navopen'));
  else if (a === 'closeNav') setNav(false);
  else if (a === 'closeDrawer') closeDrawer();
});
async function boot(){
  try { await api('/overview'); } catch (e) { return; }
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  if (!location.hash) history.replaceState(null, '', '#/overview');
  fetch(BASE + '/healthz').then(r => r.json()).then(j => { $('#ver').textContent = 'anet-hub-admin ' + (j.version || ''); }).catch(() => {});
  morphTo('menuPath', MORPH.menu);
  render();
}
document.documentElement.lang = L === 'zh' ? 'zh-CN' : 'en';
chrome();
if (TOKEN) boot();
</script>
</body>
</html>
