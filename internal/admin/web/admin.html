<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>ANetHub Admin</title>
<style>
/* ---- design tokens: shadcn-style, #165DFF on white; light + dark aware ---- */
:root{
  --primary:#165DFF; --primary-hover:#0E4FE0; --primary-soft:#EEF3FF; --primary-border:#C6D8FF;
  --bg:#FFFFFF; --bg-muted:#F5F7FA; --bg-subtle:#FCFCFD;
  --fg:#0F172A; --fg-muted:#64748B; --fg-faint:#94A3B8;
  --border:#E2E8F0; --border-strong:#CBD5E1;
  --ok:#16A34A; --ok-soft:#EAF7EF; --warn:#D97706; --warn-soft:#FEF6E7; --err:#DC2626; --err-soft:#FDECEC;
  --radius:8px; --shadow:0 1px 2px rgba(15,23,42,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --primary:#4080FF; --primary-hover:#5C94FF; --primary-soft:#16233F; --primary-border:#274A80;
    --bg:#0F1420; --bg-muted:#0A0E17; --bg-subtle:#131A28;
    --fg:#E5E9F0; --fg-muted:#9AA7BD; --fg-faint:#6B7890;
    --border:#232B3B; --border-strong:#33405A;
    --ok:#3FB269; --ok-soft:#12251A; --warn:#E3922B; --warn-soft:#2A2113; --err:#E5544B; --err-soft:#2A1717;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;color:var(--fg);background:var(--bg-muted)}
a{color:var(--primary);text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}

/* ---- layout ---- */
#app{display:none;height:100%}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:40}
#brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14.5px;white-space:nowrap}
#brand .dot{width:22px;height:22px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
#topbar .sp{flex:1}
#wsseg{display:inline-flex;background:var(--bg-muted);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
#wsseg button{display:flex;align-items:center;gap:6px;padding:5px 11px;font-size:12.5px;color:var(--fg-muted);border-radius:7px;white-space:nowrap}
#wsseg button.on{background:var(--bg);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}
#wsseg button:hover:not(.on){color:var(--fg)}
#gsearch,.gsearch{display:flex;align-items:center;gap:6px;background:var(--bg-muted);border:1px solid var(--border);border-radius:8px;padding:0 10px;height:34px;min-width:200px;max-width:340px;flex:0 1 300px}
#gsearch:focus-within,.gsearch:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,93,255,.10)}
#gsearch .gsic,.gsearch .gsic{color:var(--fg-faint);display:flex}
#gsearch input,.gsearch input{border:none;background:none;outline:none;width:100%;font-size:13px}
#sidebar{position:fixed;top:52px;left:0;bottom:0;width:232px;background:var(--bg);border-right:1px solid var(--border);padding:10px 12px;overflow:auto;z-index:30}
#main{margin:52px 0 0 232px;padding:22px 26px 56px;min-height:calc(100% - 52px)}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:8px;color:var(--fg-muted);font-size:13.5px;margin-bottom:1px;text-align:left}
.nav:hover{background:var(--bg-muted);color:var(--fg)}
.nav.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav .ph{margin-left:auto;font-size:10px;color:var(--fg-faint);font-weight:400}
.navsec{font-size:11px;color:var(--fg-faint);letter-spacing:.05em;padding:14px 10px 4px;font-weight:600}

/* ---- primitives ---- */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
.card .bd{padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--bg);color:var(--fg);transition:.15s ease-out}
.btn:hover{border-color:var(--border-strong);background:var(--bg-subtle)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.btn.danger:hover{background:var(--err-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{padding:7px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);outline:none;min-width:0}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,93,255,.10)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid transparent;white-space:nowrap;height:22px}
.badge.official{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-border)}
.badge.community{background:var(--bg-muted);color:var(--fg-muted);border-color:var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.cap{background:var(--bg-subtle);color:var(--fg-muted);border-color:var(--border);font-weight:400}
.dot8{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot8.g{background:var(--ok)}.dot8.r{background:var(--err)}.dot8.y{background:var(--warn)}.dot8.gr{background:var(--fg-faint)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{color:var(--fg-muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}
.tb td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
.tb tr:last-child td{border-bottom:none}
.tb tr.click:hover td{background:var(--bg-subtle);cursor:pointer}
.tbwrap{overflow-x:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.muted{color:var(--fg-muted)}.faint{color:var(--fg-faint)}
.grid{display:grid;gap:14px}
.sp{flex:1}.note{font-size:11.5px;color:var(--fg-faint);margin-top:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g2b{grid-template-columns:1fr 1.4fr}.g2c{grid-template-columns:1.4fr 1fr}
.mb16{margin-bottom:16px}.mt14{margin-top:14px}.mt12{margin-top:12px}.p0{padding:0}.tac{text-align:center}
.tile{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.tile .lb{font-size:12px;color:var(--fg-muted);display:flex;align-items:center;gap:6px}
.tile .v{font-size:25px;font-weight:650;margin-top:5px;letter-spacing:-.01em}
.tile .s{font-size:11.5px;color:var(--fg-faint);margin-top:3px}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
pre.out{background:#0B1220;color:#D7E0EE;border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-all}
pre.md{background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word;color:var(--fg)}

/* ---- page shell ---- */
.crumb{font-size:12px;color:var(--fg-faint);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.crumb a{color:var(--fg-muted)}
.pghd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
h2.pg{font-size:19px;font-weight:650;margin-bottom:3px;letter-spacing:-.01em}
p.pgsub{color:var(--fg-muted);font-size:12.5px;max-width:760px}
.pgact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pgfilter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sect{font-weight:600;font-size:13px;color:var(--fg-muted);margin:22px 0 10px;display:flex;align-items:center;gap:7px}

/* ---- flywheel ---- */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flowstep{flex:1;min-width:130px;padding:14px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);margin:0 4px 8px}
.flowstep.flag{border-color:var(--primary-border);background:var(--primary-soft)}
.flowname{font-size:12px;color:var(--fg-muted);font-weight:500}
.flowbig{font-size:23px;font-weight:650;margin:4px 0 4px;letter-spacing:-.01em}
.flowsub{font-size:11.5px;color:var(--fg-faint);line-height:1.5}
.flowarrow{display:flex;align-items:center;color:var(--fg-faint);padding:0 2px}

/* ---- horizontal bars ---- */
.hbar{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}
.hbar:last-child{border-bottom:none}
.hbar-l{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:8px;background:var(--bg-muted);border-radius:5px;overflow:hidden}
.hbar-fill{height:100%;background:var(--primary);border-radius:5px}
.hbar-v{font-size:12.5px;font-weight:600;white-space:nowrap}

/* ---- agent detail ---- */
.ahead{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.ava{width:46px;height:46px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:16px 0 18px;overflow-x:auto}
.tabs button{padding:9px 14px;font-size:13px;color:var(--fg-muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabs button:hover:not(.on){color:var(--fg)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13px}
.kv .k{color:var(--fg-muted)}

/* drawer */
#ovl{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:50;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,94vw);background:var(--bg);z-index:51;display:none;flex-direction:column;box-shadow:-8px 0 32px rgba(15,23,42,.14);transition:transform .2s ease-out}
#drawer .dh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
#drawer .dh .t{font-weight:650;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .db{flex:1;overflow:auto;padding:16px 18px}
.sec{margin:18px 0 8px;font-weight:600;font-size:13px}

/* login */
#login{height:100%;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(1000px 500px at 20% -10%, rgba(22,93,255,.08), transparent),
  radial-gradient(800px 400px at 90% 110%, rgba(22,93,255,.06), transparent), var(--bg-muted)}
#login .panel{width:360px;background:var(--bg);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:28px}
#login h1{font-size:17px;margin:14px 0 4px}
#login p{color:var(--fg-muted);font-size:13px;margin-bottom:18px}
#loginErr{color:var(--err);font-size:12.5px;margin-top:10px;min-height:16px}

.toast{position:fixed;bottom:20px;right:20px;z-index:80;background:#0B1220;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transition:.25s;pointer-events:none;max-width:420px}
.toast.show{opacity:1}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:48px;text-align:center;color:var(--fg-faint)}
.empty{padding:40px 24px;text-align:center}
.empty .eic{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12.5px;color:var(--fg-muted);background:var(--bg)}
.seg button.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
</style>
</head>
<body>

<div id="login">
  <div class="panel">
    <div class="row"><div style="width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">A</div></div>
    <h1>ANetHub Admin</h1>
    <p>Hub 运营与监管控制台 · 请输入管理 token</p>
    <input id="tokIn" class="inp" type="password" placeholder="管理 token" style="width:100%" autocomplete="current-password"/>
    <div id="loginErr"></div>
    <button id="loginBtn" class="btn pri" style="width:100%;justify-content:center;margin-top:6px">进入控制台</button>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div id="brand"><div class="dot">A</div>ANetHub</div>
    <div id="wsseg"></div>
    <div class="sp"></div>
    <div id="gsearch"><span class="gsic">${ic('search')}</span><input id="gq" placeholder="搜索 Agent / 名称 / 能力…"/></div>
    <button class="btn sm" onclick="render(true)" title="刷新">${ic('refresh')} 刷新</button>
    <button class="btn sm" onclick="logout()" title="退出">${ic('logout')} 退出</button>
  </div>
  <div id="sidebar"></div>
  <div id="main"></div>
</div>

<div id="ovl" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="dh"><div class="t" id="drawerTitle"></div><button class="btn sm" onclick="closeDrawer()">✕</button></div>
  <div class="db" id="drawerBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>

  inbox:'<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>',

function toast(msg, ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms)}
function fmtBytes(n){if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return n.toFixed(n>=100||i===0?0:1)+' '+u[i]}
function fmtTime(s){if(!s)return'-';const d=new Date(s);if(isNaN(d))return esc(s);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function shortAid(a){return a? (a.length>18? a.slice(0,10)+'…'+a.slice(-6):a):'-'}
function num(n){n=n||0;return n>=10000? (n/10000).toFixed(n>=100000?0:1)+'万' : String(n)}
function pct(x){return x==null?'-':(x*100).toFixed(1)+'%'}

  ${o.filters?`<div class="pgfilter">${o.filters}</div>`:''}
  ${o.body||''}`;

function spark(vals, w=140, h=36, color='var(--primary)'){
  if(!vals || vals.length<2) return '<span class="faint">数据不足</span>';
  const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-min)/rng*(h-6)).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function modChip(mod){ const map={image:'图像',video:'视频',audio:'音频',text:'文本',mixed:'多模态'}; return map[mod]||mod; }
function kpi(label,value,sub,iconName){

}
function hbars(rows){
  if(!rows.length) return '<div class="faint" style="padding:12px">暂无数据</div>';
  const max=Math.max(1,...rows.map(r=>r.value));
  return rows.map(r=>`<div class="hbar" ${r.hash?`onclick="location.hash='${r.hash}'" style="cursor:pointer"`:''}>
    <div class="hbar-l">${esc(r.label)}</div>
    <div class="hbar-track"><div class="hbar-fill" style="width:${(r.value/max*100).toFixed(1)}%"></div></div>
    <div class="hbar-v">${num(r.value)}${r.sub?` <span class="faint" style="font-weight:400">${r.sub}</span>`:''}</div></div>`).join('');
}
function flywheel(stages){

}

async function vDataOverview(){
  const [ov, ss] = await Promise.all([
    api('/overview').catch(e=>({_err:e.message})),
    api('/sessions?limit=400').catch(()=>null),
  ]);
  if(ov._err){ $('#main').innerHTML = shell({title:'数据总览', body:errCard(ov._err)}); return; }
  const ds=ov.datasets||{}, harvest=ov.harvest||[];
  const sessTotal=Object.values(ds).reduce((s,c)=>s+(c.sessions||0),0);
  const eventTotal=Object.values(ds).reduce((s,c)=>s+(c.events||0),0);
  const byteTotal=Object.values(ds).reduce((s,c)=>s+(c.bytes||0),0);
  const recTotal=harvest.reduce((s,h)=>s+(h.records||0),0);

function networkSVG(agents){
  if(!agents.length) return '<div class="faint" style="padding:24px;text-align:center">暂无 Agent</div>';
  const W=780,H=440,cx=W/2,cy=H/2,R=Math.min(cx,cy)-46,n=agents.length;
  let edges='',nodes='';
  agents.forEach((a,i)=>{
    const ang=(i/n)*Math.PI*2 - Math.PI/2;
    const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang);
    const tk=(a.review_count||0)+(a.reviews_written||0);
    const r=Math.max(5,Math.min(16,5+Math.sqrt(tk)*1.6));
    const col=a.moderation?'var(--err)':a.tier==='official'?'var(--primary)':'var(--fg-faint)';
    edges+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`;
    nodes+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${col}" opacity=".85" style="cursor:pointer" onclick="goAgent('${esc(a.aid)}')"><title>${esc(a.name||a.aid)} · ${tk} 条评价</title></circle>`;
  });
  const hub=`<circle cx="${cx}" cy="${cy}" r="22" fill="var(--primary-soft)" stroke="var(--primary)" stroke-width="2"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" fill="var(--primary)" font-weight="700">Hub</text>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:100%">${edges}${hub}${nodes}</svg>`;
}

          ${a.listed?'<span class="badge cap">已上架</span>':'<span class="badge community">未上架</span>'}
          ${mod&&mod.status&&mod.status!=='ok'?`<span class="badge err">${esc(mod.status)}</span>`:''}</div>
        <div class="mono faint" style="margin-top:5px;word-break:break-all">${esc(aid)}</div>
      </div>
      <div class="pgact">${actions}</div>
    </div>
    <div class="tabs">${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="goAgent('${esc(aid)}','${t[0]}')">${t[1]}</button>`).join('')}</div>
    <div id="atab"></div>`;
  renderAgentTab(tab, {aid, d, a, isOff, man, mod});
}

function renderAgentTab(tab, ctx){
  const el=$('#atab'); if(!el) return;
  const {aid, d, a, isOff, man, mod} = ctx;
  if(tab==='overview'){
    el.innerHTML = `
      <div class="grid g4 mb16">
        ${kpi('评分', a.review_count?a.avg_rating.toFixed(2):'-', a.review_count?`${a.review_count} 条评价`:'暂无评价', 'star')}
        ${kpi('评价 收/写', `${a.review_count||0}/${a.reviews_written||0}`, '作为提供方 / 作为请求方', 'activity')}
        ${kpi('信箱积压', a.mailbox_backlog||0, '未投递', 'inbox')}
        ${kpi('所有权', isOff?'官方':'社区', isOff?'运营面登记':'注册表', 'users')}
      </div>
      <div class="card"><div class="hd">${ic('bot')} 基本信息</div><div class="bd"><div class="kv">
        <div class="k">简介</div><div>${esc(a.summary||'-')}</div>
        <div class="k">能力</div><div class="wrap">${(a.caps||[]).map(c=>`<span class="badge cap">${esc(c)}</span>`).join('')||'-'}</div>
        <div class="k">定价</div><div>${esc(a.pricing||'-')}</div>
        <div class="k">所有权</div><div>${isOff?`官方 · ${esc(man.product_line||'-')} · 维护者 ${esc(man.maintainer||'-')}`:'社区'}</div>
        ${isOff?`<div class="k">登记 hub</div><div class="mono">${esc(man.hub||'-')}</div>`:''}
        <div class="k">注册时间</div><div>${fmtTime(a.registered_at)}</div>
      </div></div></div>
      ${a.readme?`<div class="card mt14"><div class="hd">${ic('file')} README</div><div class="bd"><pre class="md">${esc(a.readme.slice(0,6000))}</pre></div></div>`:''}`;
  }
  else if(tab==='caps'){
    el.innerHTML=`
      <div class="card"><div class="hd">${ic('layers')} 注册声明的能力</div><div class="bd wrap">${(a.caps||[]).map(c=>`<span class="badge cap">${esc(c)}</span>`).join('')||'<span class="faint">未声明能力</span>'}</div></div>
      ${isOff?`<div class="card mt14"><div class="hd">${ic('store')} 官方登记的能力</div><div class="bd wrap">${(man.caps||[]).map(c=>`<span class="badge cap">${esc(c)}</span>`).join('')||'<span class="faint">登记未列能力</span>'}</div></div>`:''}`;
  }
  else if(tab==='data'){
    const sessions=(d.sessions||[]).map(s=>`<tr class="click" onclick="openSession('${esc(s.source)}','${esc(s.session_id)}')">
      <td class="mono">${esc((s.session_id||'').slice(0,22))}</td><td><span class="badge cap">${esc(s.source)}</span></td>
      <td>${s.intent?`<span class="badge official">${esc(s.intent)}</span>`:'<span class="faint">-</span>'}</td>
      <td>${s.status==='done'?'<span class="badge ok">done</span>':s.status?'<span class="badge warn">'+esc(s.status)+'</span>':'-'}</td>
      <td class="muted">${fmtTime(s.updated_at)}</td></tr>`).join('');
    el.innerHTML=`<div class="card"><div class="hd">${ic('db')} 本 Agent 的历史采收会话（只读，待清理）</div>
      <div class="bd p0"><div class="tbwrap"><table class="tb"><tr><th>会话</th><th>来源</th><th>意图</th><th>状态</th><th>更新</th></tr>
      ${sessions||'<tr><td colspan="5" class="faint tac" style="padding:20px">无历史采收会话</td></tr>'}</table></div></div></div>`;
  }
  else if(tab==='gov'){
    el.innerHTML=`
      <div class="card"><div class="hd">${ic('shield')} 监管</div><div class="bd">
        <div class="kv" style="margin-bottom:14px">
          <div class="k">监管状态</div><div>${mod&&mod.status&&mod.status!=='ok'?`<span class="badge err">${esc(mod.status)}</span> ${esc(mod.note||'')}`:'<span class="badge ok">正常</span>'}</div>
        </div>
        <div class="row" style="flex-wrap:wrap">
          <input id="mNote" class="inp" placeholder="处置备注" style="width:180px"/>
          <button class="btn sm" onclick="moderate('${esc(aid)}','flagged')">标记关注</button>
          <button class="btn sm" onclick="moderate('${esc(aid)}','ok')">恢复正常</button>
          <button class="btn sm danger" onclick="delAgent('${esc(aid)}')">${ic('trash')} 移除注册</button>
        </div>
        <div class="faint" style="font-size:12px;margin-top:8px">移除后该身份可重新注册（黑名单强制阻断为 hub 侧路线图项）。运营面不管理任何 agent 的授权名单：谁可以委派给一个 agent 由该 agent 自己的 daemon 决定。</div>
      </div></div>`;
  }
  else if(tab==='audit'){
    el.innerHTML=`<div id="audbox">${loadingHTML()}</div>`;
    api('/audit?limit=500').then(r=>{
      const rows=(r.audit||[]).filter(x=>x.target===aid).map(x=>`<tr><td class="muted" style="white-space:nowrap">${fmtTime(x.ts)}</td><td>${esc(x.actor)}</td><td class="mono">${esc(x.action)}</td><td class="muted" style="max-width:420px;word-break:break-all">${esc((x.detail||'').slice(0,300))}</td></tr>`).join('');
      $('#audbox').innerHTML=`<div class="card"><div class="tbwrap"><table class="tb"><tr><th>时间</th><th>操作者</th><th>动作</th><th>详情</th></tr>${rows||'<tr><td colspan="4" class="faint tac" style="padding:20px">该 Agent 暂无审计记录</td></tr>'}</table></div></div>`;
    }).catch(e=>{ $('#audbox').innerHTML=errCard(e.message); });
  }
}
/* ---- placeholder views ---- */
function placeholderView(title, note){
  return async ()=>{ $('#main').innerHTML = shell({title, body: empty('模块建设中', note)}); };
}

/* ---------------- route table ---------------- */
Object.assign(ROUTES, {
  'operations/overview': vOpsOverview,
  'operations/agents': vAgents,
  'operations/onboarding': placeholderView('接入队列','将展示待验证/验证失败/接入测试中的 Agent 及协议、健康检查与签名状态。需接入接入流水线数据。'),
  'operations/reviews': placeholderView('审核认证','首次发布/官方认证/版本更新审核工作台（资料·能力·权限·版本差异 + 自动检测）。需接入审核流水线。'),
  'operations/store': vStore,
  'operations/capabilities': vCapabilities,
  'operations/channels': placeholderView('产品渠道','配置 Agent 在各 ANet 产品中的分发策略、曝光范围与灰度比例。需接入渠道配置。'),
  'operations/officials': vOfficials,
  'operations/incidents': placeholderView('告警与事故','将区分告警（信号）与事故（需跟踪处置的事件），带状态机与影响面。需接入事故管理。'),
  'operations/risk': vRisk,
  'operations/enforcement': vEnforcement,
  'operations/recycle': vRecycle,
  'data/overview': vDataOverview,
  'data/sessions': vSessions,
  'data/anomalies': vAnomalies,
  'data/caps': vCapOps,
  'data/grounding': vGrounding,
  'data/collab': vCollab,
  'data/governance': placeholderView('数据治理','授权与用途、脱敏与保留、数据血缘与删除。需 OKF 扩展授权/脱敏/血缘字段。'),
  'ecosystem/overview': vEcoOverview,
  'ecosystem/matrix': vMatrix,
  'ecosystem/network': vNetwork,
  'ecosystem/vision': vVision,
  'platform/status': vPlatformStatus,
  'platform/audit': vAudit,
  'platform/connections': placeholderView('连接与集成','Agent 接入协议与 Webhook/API 配置总览。'),
});

/* ---------------- init ---------------- */
$('#topbar').innerHTML = $('#topbar').innerHTML.replace(/\$\{ic\('(\w+)'\)\}/g,(_,n)=>ic(n));
wireGlobalSearch();
if(TOKEN){ boot() } else { $('#login').style.display='flex' }
</script>
